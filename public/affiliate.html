<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affiliate - BLOCK777</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="logo">AFFILIATES</div>
        <button class="btn btn-primary" onclick="window.location.href='index.html'">Back to App</button>
    </nav>
    <div class="screen active">
        <div class="glass-card" style="margin-bottom:20px">
            <h3>Your Referral Link</h3>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <input type="text" id="ref-link" readonly>
                <button class="btn btn-primary" onclick="affiliate.copyReferralLink()">Copy</button>
            </div>
        </div>

        <div class="grid grid-2" style="margin-bottom:20px">
            <div class="card"><h3>Total Referred</h3><p id="stat-referred">0</p></div>
            <div class="card"><h3>Total Commissions</h3><p id="stat-commissions">R$ 0,00</p></div>
            <div class="card"><h3>Available Balance</h3><p id="stat-balance">R$ 0,00</p></div>
        </div>
        
        <button class="btn btn-success" style="width:100%" onclick="affiliate.redeemCommissions()">Redeem to Wallet</button>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="js/app.js"></script>
    <script src="js/affiliate.js"></script>
</body>
</html>
