<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOCK777</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="logo">BLOCK777</div>
        <div class="menu-items">
            <button class="btn btn-primary" onclick="app.showScreen('menu-screen')">Home</button>
            <button class="btn btn-primary" onclick="app.showScreen('wallet-screen')">Wallet</button>
            <button class="btn btn-primary" onclick="app.logout()">Logout</button>
        </div>
        <div class="balance-pill" id="nav-balance">R$ 0,00</div>
    </nav>

    <div id="auth-screen" class="screen active">
        <div class="glass-card">
            <h2>Login</h2>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Email" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit" class="btn btn-primary" style="width:100%">Login</button>
            </form>
            <hr style="margin:20px 0; border-color:var(--color-border)">
            <h2>Register</h2>
            <form id="register-form">
                <input type="text" id="reg-username" placeholder="Username" required>
                <input type="email" id="reg-email" placeholder="Email" required>
                <input type="password" id="reg-password" placeholder="Password" required>
                <button type="submit" class="btn btn-primary" style="width:100%">Register</button>
            </form>
        </div>
    </div>

    <div id="menu-screen" class="screen">
        <div class="glass-card" style="text-align:center">
            <h1>Welcome to BLOCK777</h1>
            <p>Your balance: <strong id="menu-balance">R$ 0,00</strong></p>
            <div class="grid grid-2" style="margin-top:20px">
                <button class="btn btn-primary" onclick="game.showGamePrep('real')">Play for Real</button>
                <button class="btn" style="background:#555; color:white;" onclick="game.startDemoGame()">Demo Mode</button>
            </div>
            <div class="grid grid-2" style="margin-top:20px">
                <button class="btn" style="border:1px solid var(--color-primary); color:var(--color-primary)" onclick="app.showScreen('wallet-screen')">Wallet</button>
                <button class="btn" style="border:1px solid var(--color-success); color:var(--color-success)" onclick="window.location.href='affiliate.html'">Affiliates</button>
            </div>
        </div>
    </div>

    <div id="game-screen" class="screen">
        <canvas id="game-canvas"></canvas>
        <div class="game-hud">
            <div>
                <div>Multiplier: <strong id="game-multiplier" style="color:var(--color-primary)">1.00x</strong></div>
                <div>Floor: <span id="game-floor">0</span></div>
            </div>
            <button id="btn-cashout" class="btn btn-success" style="display:none;" onclick="game.cashout()">CASHOUT</button>
        </div>
    </div>

    <div id="wallet-screen" class="screen">
        <div class="glass-card">
            <h2>Wallet</h2>
            <p>Balance: <strong id="wallet-balance">R$ 0,00</strong></p>
            
            <div style="margin-top:20px">
                <h3>Deposit</h3>
                <input type="number" id="dep-amount" placeholder="Amount (BRL)">
                <button class="btn btn-success" onclick="wallet.requestDeposit()">Generate PIX</button>
                <div id="pix-container" style="margin-top:10px; display:none;">
                    <p>PIX Code:</p>
                    <input type="text" id="pix-code" readonly>
                </div>
            </div>

            <div style="margin-top:20px">
                <h3>Withdraw</h3>
                <input type="number" id="with-amount" placeholder="Amount (BRL)">
                <input type="text" id="with-key" placeholder="PIX Key">
                <button class="btn btn-danger" onclick="wallet.requestWithdraw()">Withdraw</button>
            </div>

            <div style="margin-top:20px">
                <h3>History</h3>
                <table id="tx-history">
                    <thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="js/app.js"></script>
    <script src="js/game.js"></script>
    <script src="js/wallet.js"></script>
</body>
</html>
